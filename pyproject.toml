[tool.poetry]
name = "quantaq-cli"
version = "1.0.0rc0"
description = "The QuantAQ Python Toolkit and CLI"
authors = ["David H Hagan <david.hagan@quant-aq.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/quant-aq/cli"
documentation = "https://quant-aq.github.io/cli/"
keywords = []
classifiers = []

[tool.poetry.dependencies]
python = ">=3.9, <3.14"
pandas = ">=2.1.4,<2.2"
click = "^8.1"
pyarrow = ">=14.0.2"
terminaltables = "^3.1.0"
urllib3 = "^1.26.10"
numpy = "^1.23.2"
rich-click = ">=1.7.2"
loguru = "^0.7.3"
jupyter = "^1.1.1"
pandera = ">=0.24,<0.29"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
pytest-cov = ">=0.0"
sphinx = "^7.0"
myst-parser = "^2.0"
toml = "^0.10.1"
sphinx-click = {version = "^6.2", python = ">=3.10,<3.14"}
sphinx-rtd-theme = "^2.0"
setuptools = "^65.6.3"

[tool.poetry.scripts]
quantaq-cli = "quantaq_cli.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
